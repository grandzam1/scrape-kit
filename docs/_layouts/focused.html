<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <div id="portal-shell" class="portal-theme" data-mobile>
    <header class="portal-fixed-top-bar">
      <a class="back" href="{{ '/' | relative_url }}" aria-label="Back">←</a>
      <div class="title">{{ page.title | default: "Scrape" }}</div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme" aria-pressed="false">dark</button>
    </header>
    <main class="portal-shell-content portal-shell-content--focused">
      {{ content }}
    </main>
  </div>
</body>
</html>
