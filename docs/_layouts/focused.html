<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scrapes">
  <meta name="theme-color" content="#ffffff" id="meta-theme-color">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/icons/icon-192.png' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/icons/icon-192.png' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600">
  <link rel="stylesheet" href="{{ '/assets/portal-shell.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div id="portal-shell" class="portal-theme" data-mobile>
    <header class="portal-fixed-top-bar">
      <a class="back" href="{{ '/' | relative_url }}" aria-label="Back">←</a>
      <div class="title">{{ page.title | default: "Scrape" }}</div>
      <span></span>
    </header>
    <main class="portal-shell-content portal-shell-content--focused">
      {{ content }}
    </main>
  </div>
</body>
</html>
