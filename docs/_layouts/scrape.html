---
layout: focused
---
<article class="changelog">
  <header class="changelog-header">
    <div class="changelog-info">
      <div class="changelog-version">{{ page.title | default: "scrape" }}</div>
      {% if page.scrapedAt %}
      <div class="changelog-date">{{ page.scrapedAt | date: "%b %-d, %Y" }}</div>
      {% endif %}
    </div>
    {% if page.source %}
    <a class="changelog-source" href="{{ page.source }}">source</a>
    {% endif %}
  </header>
  <div class="changelog-body long-text">
    {{ content }}
  </div>
</article>
