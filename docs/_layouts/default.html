<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scrapes">
  <meta name="theme-color" content="#f4f4f4" id="meta-theme-color">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/icons/icon-192.png' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/icons/icon-192.png' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500">
  <link rel="stylesheet" href="{{ '/assets/portal-shell.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div id="portal-shell" class="portal-theme" data-mobile>
    <main class="portal-shell-content portal-shell-content--tab-bar">
      {{ content }}
      <p class="foot">
        <a href="{{ '/' | relative_url }}">Home</a>
        ·
        <a href="https://github.com/grandzam1/scrape-kit">GitHub</a>
      </p>
    </main>
    <nav class="portal-mobile-nav" aria-label="Primary">
      <div class="portal-mobile-nav__inner">
        <a class="nav-item is-active" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav-item" href="https://github.com/grandzam1/scrape-kit">GitHub</a>
      </div>
    </nav>
  </div>
</body>
</html>
