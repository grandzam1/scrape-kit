<script>
(function () {
  try {
    var key = "scrape-kit-theme";
    var saved = localStorage.getItem(key);
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  } catch (e) {}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scrapes">
<meta name="theme-color" content="#f4f4f4" id="meta-theme-color" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/icons/icon-192.png' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/icons/icon-192.png' | relative_url }}">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500">
<link rel="stylesheet" href="{{ '/assets/portal-shell.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script>
  window.SCRAPE_WS = "{{ site.scrape_ws }}";
</script>
<script src="{{ '/assets/scrape.js' | relative_url }}" defer></script>
<script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
